apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotify-now-playing
  namespace: spotify-now-playing
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/status
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - k8s.whatishenrylisteningto.com
        - whatishenrylisteningto.com
        - henryfranco.dev
  rules:
    - host: k8s.whatishenrylisteningto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-now-playing
                port:
                  number: 80
    - host: whatishenrylisteningto.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spotify-now-playing
                port:
                  number: 80
    - host: henryfranco.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: henryfranco-dev
                port:
                  number: 80
