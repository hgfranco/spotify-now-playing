apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-now-playing
  namespace: spotify-now-playing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotify-now-playing
  template:
    metadata:
      labels:
        app: spotify-now-playing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: spotify-now-playing
          image: 643593783040.dkr.ecr.us-east-1.amazonaws.com/spotify-now-playing:0.1.0
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: spotify-now-playing
                  key: DATA_DIR
          volumeMounts:
            - name: data
              mountPath: /var/data
      volumes:
        - name: data
          emptyDir: {}