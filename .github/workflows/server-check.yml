name: Server checks

on:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-check.yml"
  push:
    branches:
      - what-is-henry-listening-to
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-check.yml"

jobs:
  validate-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate server.js syntax
        run: npm run check
