name: Kubernetes manifests
on:
  pull_request:
    paths: ["kubernetes/**", ".github/workflows/kubernetes-check.yml"]
  push:
    branches: [main, route-henryfranco-personal-site]
    paths: ["kubernetes/**", ".github/workflows/kubernetes-check.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Validate Kubernetes schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          kubeconform -strict -summary -kubernetes-version 1.35.0 kubernetes/ingress.yaml
