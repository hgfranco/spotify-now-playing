name: Apply static security fix

on:
  push:
    branches:
      - fix/restrict-static-files

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restrict-static-files

      - name: Remove broad static file serving
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server.js')
          text = path.read_text()
          old = '// Serve static assets from the project directory (logo, favicons)\napp.use(express.static(__dirname));\n'
          new = '// Public assets are served only through the explicit routes below.\n'
          if old not in text:
              raise SystemExit('Expected static middleware block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate server.js syntax
        run: node --check server.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Restrict static file exposure"
          git push origin HEAD:fix/restrict-static-files
