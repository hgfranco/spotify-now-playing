apiVersion: v1
kind: Pod
metadata:
  name: scheduling-check
  namespace: spotify-now-playing
spec:
  nodeSelector:
    kubernetes.io/hostname: kubernetes-control
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
  restartPolicy: Never